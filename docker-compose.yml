services:
  theia-web-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: theia_web_api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379/1}
      FINANCE_API_INTERNAL_URL: ${FINANCE_API_INTERNAL_URL:-http://localhost:8081}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://theia-finance.ir}
